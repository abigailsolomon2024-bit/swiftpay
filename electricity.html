<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Electricity Payment | SwiftPay</title>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="style.css"
>

</head><body><header class="dashboard-header">

    <div>

        <h2>
            SwiftPay
        </h2>

        <p>
            Electricity Payment
        </p>

    </div>

    <a
        href="dashboard.html"
        class="back-button"
    >
        ←
    </a>

</header>


<main class="dashboard-container">

    <section class="quick-actions">

        <h2>
            Pay Electricity Bill
        </h2>

        <p>
            Pay your electricity bill securely with SwiftPay.
        </p>


        <form id="electricityForm">

            <select
                id="electricityProvider"
                required
            >

                <option value="">
                    Select Electricity Provider
                </option>

                <option value="AEDC">
                    AEDC
                </option>

                <option value="EKEDC">
                    EKEDC
                </option>

                <option value="IKEDC">
                    IKEDC
                </option>

                <option value="EEDC">
                    EEDC
                </option>

                <option value="PHED">
                    PHED
                </option>

            </select>


            <input
                type="text"
                id="meterNumber"
                placeholder="Meter Number"
                required
            >


            <input
                type="number"
                id="electricityAmount"
                placeholder="Amount (₦)"
                min="500"
                required
            >


            <button
                type="submit"
                id="electricityButton"
            >
                Pay Electricity Bill
            </button>


            <p id="electricityMessage"></p>

        </form>

    </section>

</main>


<nav class="bottom-nav">

    <a
        href="dashboard.html"
        class="nav-item"
    >
        <span>🏠</span>
        <small>Home</small>
    </a>

    <a
        href="wallet.html"
        class="nav-item"
    >
        <span>💳</span>
        <small>Wallet</small>
    </a>

    <a
        href="transactions.html"
        class="nav-item"
    >
        <span>📜</span>
        <small>History</small>
    </a>

    <a
        href="profile.html"
        class="nav-item"
    >
        <span>👤</span>
        <small>Profile</small>
    </a>

</nav>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="app.js"></script>

</body></html>
