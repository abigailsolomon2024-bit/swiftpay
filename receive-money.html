<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receive Money | SwiftPay</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">

        <header class="page-header">
            <a href="dashboard.html" class="back-btn">←</a>
            <h1>Receive Money</h1>
        </header>

        <main class="receive-container">

            <div class="receive-icon">
                💰
            </div>

            <h2>Receive Money</h2>

            <p class="receive-subtitle">
                Share your SwiftPay account number with the sender to receive money.
            </p>

            <div class="account-card">

                <span class="account-label">
                    Your SwiftPay Account Number
                </span>

                <div class="account-number-row">
                    <strong id="accountNumber">Loading...</strong>

                    <button id="copyAccountBtn" class="copy-btn">
                        Copy
                    </button>
                </div>

            </div>

            <div class="receive-info">
                <p>💡 <strong>How it works</strong></p>

                <p>
                    Give your SwiftPay account number to anyone who wants
                    to send money to you.
                </p>

                <p>
                    You don't need to share your email address or password.
                </p>
            </div>

            <button
                class="primary-btn"
                onclick="window.location.href='dashboard.html'"
            >
                Back to Dashboard
            </button>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>

        async function loadAccountNumber() {

            const {
                data: { user },
                error
            } = await supabaseClient.auth.getUser();

            if (error || !user) {
                window.location.href = "login.html";
                return;
            }

            const { data, error: profileError } = await supabaseClient
                .from("profiles")
                .select("account_number")
                .eq("id", user.id)
                .single();

            if (profileError) {
                console.error(profileError);
                document.getElementById("accountNumber").textContent =
                    "Account number unavailable";
                return;
            }

            document.getElementById("accountNumber").textContent =
                data.account_number || "Not assigned";
        }


        document.getElementById("copyAccountBtn").addEventListener("click", async function () {

            const accountNumber =
                document.getElementById("accountNumber").textContent;

            if (
                accountNumber &&
                accountNumber !== "Loading..." &&
                accountNumber !== "Not assigned"
            ) {

                await navigator.clipboard.writeText(accountNumber);

                this.textContent = "Copied ✓";

                setTimeout(() => {
                    this.textContent = "Copy";
                }, 2000);
            }

        });


        loadAccountNumber();

    </script>

</body>
</html>
